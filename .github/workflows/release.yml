name: Release

# Push a tag like v1.2.3 → builds FnCheatsheet.exe stamped with that version, runs the self-test
# and publishes it (plus FnCheatsheet.exe.sha256, which the in-app updater verifies) as a GitHub release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./build.ps1 -Version $version
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "docs/release-notes/$tag.md"
          $assets = @('dist/FnCheatsheet.exe', 'dist/FnCheatsheet.exe.sha256')
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            exit $LASTEXITCODE
          }
          $notesArgs = if (Test-Path $notes) { @('--notes-file', $notes) } else { @('--generate-notes') }
          gh release create $tag @assets --title "Fn Cheatsheet $tag" @notesArgs --verify-tag
