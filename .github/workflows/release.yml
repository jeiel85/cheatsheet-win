name: Release

# Push a tag like v1.2.3 → builds FnCheatsheet.exe stamped with that version, runs the self-test
# and publishes it (plus FnCheatsheet.exe.sha256, which the in-app updater verifies) as a GitHub release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./build.ps1 -Version $version
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          $notes = "docs/release-notes/$tag.md"
          $assets = @('dist/FnCheatsheet.exe', 'dist/FnCheatsheet.exe.sha256')
          gh release view $tag *> $null
          $created = $LASTEXITCODE -ne 0
          if ($created) {
            # Create as a draft first: a published release without its assets would become "latest"
            # and break the in-app updater and the README download link.
            $notesArgs = if (Test-Path $notes) { @('--notes-file', $notes) } else { @('--generate-notes') }
            gh release create $tag --draft --title "Fn Cheatsheet $tag" @notesArgs --verify-tag
            if ($LASTEXITCODE -ne 0) { throw "release create failed" }
          }
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "asset upload failed" }
          # Check what GitHub actually serves before publishing.
          $names = gh release view $tag --json assets -q '.assets[].name'
          foreach ($a in 'FnCheatsheet.exe', 'FnCheatsheet.exe.sha256') {
            if ($names -notcontains $a) { throw "missing asset $a" }
          }
          # Publish if the release is still a draft — created by this run, or left behind by a failed run.
          # It becomes "latest" only if it is newer than the current latest, so re-running an old tag never
          # moves "latest" backwards. Already-published releases only get their assets refreshed.
          $isDraft = (gh release view $tag --json isDraft -q '.isDraft') -eq 'true'
          if ($isDraft) {
            $current = gh release view --json tagName -q '.tagName' 2>$null
            $makeLatest = $LASTEXITCODE -ne 0 -or -not $current -or ([version]$tag.TrimStart('v') -gt [version]$current.TrimStart('v'))
            gh release edit $tag --draft=false "--latest=$($makeLatest.ToString().ToLower())"
            if ($LASTEXITCODE -ne 0) { throw "publish failed" }
          }
